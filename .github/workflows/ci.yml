name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen swiftlint swift-format
      - name: Lint
        run: make lint
      - name: Test packages
        run: make test
      - name: Build app and widget
        run: make build
