name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # macOS arm64 hosted runners were capacity-queued and cancelled; verified green on 2026-11-17 with Xcode 26.6 (run 44139284324).
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen swiftlint swift-format
      - name: Lint
        run: make lint
      - name: Test packages
        run: make test
      - name: Build app and widget
        run: make build
